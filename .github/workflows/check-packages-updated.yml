name: Check if NuGets are using the latest version

on:
  workflow_call:
    inputs:
      solution_location:
        required: false
        default: .
        type: string
      solution:
        required: false
        type: string

jobs:
  check_nugets_using_latest_version:
    name: NuGets using latest version
    timeout-minutes: 15
    runs-on: windows-2022

    env:
      GITHUB_AUTH_TOKEN: ${{ secrets.NANOBUILD_PAT }}

    steps:

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: nanoframework/nanobuild@v1
        with:
          gitHubAuth: ${{ secrets.GITHUB_TOKEN }}

      - uses: nuget/setup-nuget@v4
          
      - name: Check NuGets updated
        env:
          solution_location:  ${{ inputs.solution_location }}
          solution:  ${{ inputs.solution }}
        run: |
          echo "Working at: ${{ env.solution_location }}"
          cd "${{ env.solution_location }}" >> $null

          # output nuget version
          nuget help | select -First 1

          # find solution
          $solution = (Get-ChildItem -Path "${{ env.solution }}")

          if($solution.Count -eq 0)
          {
            Write-Host "🛑 Couldn't find the solution file! 🛑 "
            exit 1
          }
          elseif($solution.Count -gt 1)
          {
            Write-Host "🛑 Found more than one solution file! 🛑 "
            exit 1
          }
          else
          {
            $solution = $solution[0]
          }

          # restore
          nuget restore $solution -UseLockFile

          # get projects in the solution
          # (nuget update with a solution scans ALL packages.config under the solution folder, so update per project instead)
          $solutionDir = $solution.DirectoryName

          if($solution.Extension -eq ".slnx")
          {
            $projectPaths = ([xml](Get-Content $solution.FullName -Raw)).SelectNodes("//Project") | ForEach-Object { $_.Path }
          }
          else
          {
            $projectPaths = Select-String -Path $solution.FullName -Pattern '^Project\("\{[^}]+\}"\)\s*=\s*"[^"]*",\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          }

          $projectPaths = $projectPaths | Where-Object { $_ -match 'proj$' }

          # packages folder: use repositoryPath from NuGet.Config if set, otherwise default to 'packages' next to the solution
          Push-Location $solutionDir
          $repositoryPath = nuget config repositoryPath -AsPath 2>$null
          Pop-Location

          if([string]::IsNullOrWhiteSpace($repositoryPath))
          {
            $repositoryPath = Join-Path $solutionDir "packages"
          }

          # update NuGets of each project in the solution
          foreach($projectPath in $projectPaths)
          {
            $projectFile = Join-Path $solutionDir ($projectPath -replace '[\\/]', [IO.Path]::DirectorySeparatorChar)
            $packagesConfig = Join-Path (Split-Path $projectFile -Parent) "packages.config"

            if(Test-Path $packagesConfig)
            {
              Write-Host "Checking NuGets for '$projectPath'"

              nuget update $packagesConfig -RepositoryPath $repositoryPath

              if($LASTEXITCODE -ne 0)
              {
                Write-Host "🛑 Failed to update NuGets for '$projectPath'! 🛑"
                exit 1
              }
            }
            else
            {
              Write-Host "Skipping '$projectPath' (no packages.config)"
            }
          }

          # check if anything was changed
          $repoStatus = "$(git status --short --porcelain)"

          if (-not [string]::IsNullOrEmpty($repoStatus))
          {
            echo "🛑 Some NuGet packages aren't using the latest version! 🛑"
            echo "Please update all NuGet packages to their latest version."
            echo "Differences found:"
            echo "$repoStatus"

            exit 1
          }
          else
          {
            echo "✅ All NuGet packages are up to date"
          }
        shell: pwsh
