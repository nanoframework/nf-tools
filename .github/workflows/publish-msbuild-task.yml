name: Publish MSBuild Task to Marketplace

on:
  push:
    branches:
      - main
    paths:
      - 'AzureDevOps/TaskInstallMSBuildComponents/**'
  workflow_dispatch:

env:
  EXTENSION_PATH: AzureDevOps/TaskInstallMSBuildComponents

jobs:
  publish-extension:
    name: Publish MSBuild Task Extension
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Install TFX CLI
        run: npm install -g tfx-cli

      - name: Validate manifest
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          Write-Host "Validating vss-extension.json manifest..."
          if (-Not (Test-Path "vss-extension.json")) {
            Write-Error "vss-extension.json not found"
            exit 1
          }
          $manifest = Get-Content vss-extension.json -Raw | ConvertFrom-Json
          $task = Get-Content TaskFiles/task.json -Raw | ConvertFrom-Json
          $taskVersion = "$($task.version.Major).$($task.version.Minor).$($task.version.Patch)"
          if ($manifest.version -ne $taskVersion) {
            Write-Error "Extension version ($($manifest.version)) does not match task version ($taskVersion)."
            exit 1
          }

          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $baseSha = $event.before
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') {
            $baseSha = git rev-parse HEAD^
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Unable to determine the previous revision for the version preflight."
              exit 1
            }
          }

          $baseManifestJson = git show "${baseSha}:$env:EXTENSION_PATH/vss-extension.json" | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unable to read the extension manifest from the previous revision ($baseSha)."
            exit 1
          }
          $baseManifest = $baseManifestJson | ConvertFrom-Json

          try {
            $currentVersion = [version]$manifest.version
            $previousVersion = [version]$baseManifest.version
          }
          catch {
            Write-Error "Current and previous extension versions must be numeric major.minor.patch values."
            exit 1
          }

          if ($currentVersion -le $previousVersion) {
            Write-Error "Extension version $($manifest.version) must be greater than the previous version $($baseManifest.version). Bump the task and extension versions before publishing."
            exit 1
          }

          Write-Host "✓ Extension ID: $($manifest.id)"
          Write-Host "✓ Publisher: $($manifest.publisher)"
          Write-Host "✓ Version: $($manifest.version) (task and extension versions match; version increased)"

      - name: Publish extension to marketplace
        working-directory: ${{ env.EXTENSION_PATH }}
        env:
          AZDO_PAT: ${{ secrets.AZDO_MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:AZDO_PAT")) {
            Write-Error "AZDO_MARKETPLACE_PAT secret is not configured. Please set it in repository settings."
            exit 1
          }
          
          Write-Host "Submitting extension..."
          tfx extension publish --publisher nanoframework --manifest-globs vss-extension.json --token "$env:AZDO_PAT" --no-wait-validation
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to publish extension"
            exit 1
          }
          
          Write-Host "✓ Extension submitted successfully"

      - name: Log submitted version
        if: success()
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          $manifest = Get-Content vss-extension.json -Raw | ConvertFrom-Json
          Write-Host "Submitted extension version: $($manifest.version)"
          Write-Host "Publisher: $($manifest.publisher)"
          Write-Host "Extension: $($manifest.name)"
